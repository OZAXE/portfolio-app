# Opérations d'administration ponctuelles, lancées à la main (onglet Actions de GitHub ou `gh workflow run`).
# Le code d'accès reste dans les secrets du repo : il n'apparaît jamais dans les logs.
name: Admin

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Identifiant du Sheet à construire (vide, partagé en Éditeur avec le compte de service)"
        required: true
      migrate_from:
        description: "Identifiant de l'ancien Sheet à migrer (laisser vide pour un modèle vierge)"
        required: false

jobs:
  setup-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Réveille l'API (Render gratuit)
        run: |
          for i in $(seq 1 12); do
            curl -sf --max-time 60 https://portfolio-app-blvx.onrender.com/health && break
            sleep 10
          done
      # Identifiants lus dans le fichier de l'événement puis masqués : collés tels quels dans le script
      # (${{ inputs.target }}), ils s'affichaient dans les journaux publics et pouvaient y injecter une commande.
      # La réponse (adresse du Sheet, titres migrés) n'est pas affichée non plus : seulement le statut HTTP
      - name: Construit le Sheet modèle
        env:
          TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
        run: |
          TARGET=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
          MIGRATE=$(jq -r '.inputs.migrate_from // ""' "$GITHUB_EVENT_PATH")
          for v in "$TARGET" "$MIGRATE"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 900 -X POST -G \
            -H "X-Access-Token: $TOKEN" \
            --data-urlencode "target=$TARGET" --data-urlencode "migrate_from=$MIGRATE" \
            https://portfolio-app-blvx.onrender.com/admin/sheet/setup)
          echo "Réponse de l'API : HTTP $code : ouvre le Sheet pour vérifier le résultat"
          [ "$code" = "200" ]

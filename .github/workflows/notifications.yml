# Envoi des notifications, à part du calcul (screener.yml, le soir) pour qu'elles arrivent à des heures
# normales. Léger : l'API (réglages de chaque utilisateur, briefs, récap) et les données déjà publiées sur
# la branche screener-data.
#   - matin : nouveau brief, récap de la semaine le samedi, alertes de la nuit (attend les données de la
#     nuit jusqu'à 3 h si GitHub a lancé le calcul en retard, puis échoue : mail de GitHub) ;
#   - soir : nouveau brief déposé dans la journée (le samedi), annoncé le soir même.
# Heures fixes en UTC : une heure de plus à Paris l'été. GitHub lance souvent ses tâches planifiées avec
# quelques minutes à quelques heures de retard (surtout aux heures rondes très demandées, d'où les minutes 07).

name: Notifications

on:
  schedule:
    - cron: "7 7 * * *"    # 8 h 07 à Paris l'hiver, 9 h 07 l'été
    - cron: "7 17 * * *"   # 18 h 07 à Paris l'hiver, 19 h 07 l'été
  workflow_dispatch:
    inputs:
      passage:
        description: "Passage à lancer"
        type: choice
        options: [matin, soir]
        default: matin

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Envoie les notifications
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PASSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.passage || (github.event.schedule == '7 17 * * *' && 'soir' || 'matin') }}
        run: |
          if [ "$PASSAGE" = "soir" ]; then
            python screener/notify.py --briefs-only
          else
            python screener/notify.py --morning
          fi

# Annonce du nouveau brief en fin d'après-midi : le brief est déposé le samedi dans la journée, et le calcul
# de nuit (screener.yml) ne l'annonçait qu'à sa fin, le lendemain vers 9-10 h. Léger : aucune donnée du
# screener, seulement l'API (liste des briefs et réglages de notification de chaque utilisateur).

name: Notifications du soir

on:
  schedule:
    # 17 h 07 UTC : 18 h à Paris l'hiver, 19 h l'été (heure fixe en UTC), plus le retard de GitHub, qui lance
    # ses tâches planifiées avec quelques minutes à plusieurs heures de décalage (calcul de nuit : 4 à 6 h)
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Annonce le nouveau brief
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python screener/notify.py --briefs-only

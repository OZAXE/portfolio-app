# Screener nocturne : analyse les actions de screener/universe.csv et publie
# screener.json sur la branche screener-data, lue directement par l'appli.
# Branche séparée pour ne pas redéclencher les déploiements Render à chaque nuit.

name: Screener

on:
  schedule:
    # 21 h 47 UTC : 22 h 47 à Paris l'hiver, 23 h 47 l'été, après la clôture de New York (22 h à Paris) et le délai
    # des cours GOOGLEFINANCE. Avant (novembre 2026) : 1 h UTC, une heure très demandée que GitHub lançait avec
    # 4 à 6 h de retard (fin du calcul entre 8 h 40 et 10 h à Paris). Les notifications ne partent pas d'ici mais
    # du passage du matin (notifications.yml), pour ne réveiller personne : ce workflow ne fait que calculer
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      max_fundamentals:
        description: "Nombre maximum d'actions dont on rafraîchit les fondamentaux"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installe les paquets
        id: install
        run: pip install -r backend/requirements.txt openpyxl==3.1.5

      - name: Récupère les résultats précédents
        id: previous
        run: |
          if git fetch origin screener-data --depth=1; then
            git worktree add data origin/screener-data
          else
            mkdir -p data
          fi

      # En premier : les cours de clôture du jour sont prêts (relevé daté par snapshot.market_day)
      - name: Relevé quotidien du patrimoine
        id: snapshot
        continue-on-error: true
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          NIGHT_REPORT: ${{ runner.temp }}/rapport-nuit.txt
        run: python screener/snapshot.py

      - name: Super investisseurs (13F de la SEC)
        id: superinvestors
        continue-on-error: true
        run: python screener/superinvestors.py --data-dir data

      - name: Lance le screener
        id: screener
        run: python screener/run.py --data-dir data --max-fundamentals "${{ inputs.max_fundamentals || '2000' }}" --time-budget-min 200

      - name: Traduction en français des présentations d'entreprise
        id: translate
        continue-on-error: true
        run: python screener/translate_profiles.py --data-dir data --max 800 --time-budget-min 20

      - name: Contenu des ETF (composition des grands indices)
        id: lookthrough
        continue-on-error: true
        run: python screener/etf_lookthrough.py --data-dir data

      - name: Frais courants des ETF détenus
        id: etf_fees
        continue-on-error: true
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
        run: python screener/etf_fees.py --data-dir data

      - name: Historique financier (SEC pour les US, Yahoo archivé pour le reste)
        id: financials
        continue-on-error: true
        run: python screener/financials.py --data-dir data --max 400 --time-budget-min 30

      # Publié même si une étape a échoué : le travail déjà fait n'est pas perdu
      - name: Publie sur la branche screener-data
        id: publish
        if: always()
        run: |
          cd data
          git config --global user.name "screener-bot"
          git config --global user.email "screener-bot@users.noreply.github.com"
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -b screener-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          else
            git checkout -B screener-data
          fi
          git add -A .
          # Un seul commit gardé : l'historique de ce gros fichier n'a pas d'intérêt et alourdirait le repo
          git commit --amend -m "Screener du $(date -u +%F)" || git commit -m "Screener du $(date -u +%F)"
          git push --force origin screener-data

      # Les étapes en « continue-on-error » laissent le workflow vert même quand elles plantent : sans ce rapport,
      # un relevé refusé ou un screener cassé passait inaperçu (la courbe s'arrêtait sans prévenir)
      - name: Prévient en cas d'échec (ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NIGHT_REPORT: ${{ runner.temp }}/rapport-nuit.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: >-
            Installation des paquets=${{ steps.install.outcome }};
            Résultats précédents=${{ steps.previous.outcome }};
            Relevé du patrimoine=${{ steps.snapshot.outcome }};
            Super investisseurs=${{ steps.superinvestors.outcome }};
            Screener=${{ steps.screener.outcome }};
            Traduction des présentations=${{ steps.translate.outcome }};
            Contenu des ETF=${{ steps.lookthrough.outcome }};
            Frais des ETF=${{ steps.etf_fees.outcome }};
            Historique financier=${{ steps.financials.outcome }};
            Publication des données=${{ steps.publish.outcome }}
        run: python screener/night_report.py

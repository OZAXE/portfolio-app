<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio Insights</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-neg: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    header {
      padding: 20px 16px 8px;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
    }
    #positions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
    }
    .card .ticker {
      font-weight: 600;
      font-size: 16px;
    }
    .card .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .positive { color: var(--accent); }
    .negative { color: var(--accent-neg); }
    .unreliable { color: var(--muted); font-style: italic; }
    .card .hypotheses {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .card details {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .card details summary { cursor: pointer; }
    .card details ul { margin: 6px 0 0; padding-left: 18px; }
    .card details li { margin-top: 4px; }
    #status {
      padding: 16px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mon portefeuille</h1>
  </header>
  <div id="status">Chargement des analyses…</div>
  <div id="positions"></div>

  <script>
    // À adapter avec l'URL de ton backend une fois déployé sur Render
    const API_BASE_URL = "https://portfolio-app-blvx.onrender.com";

    async function loadPortfolio() {
      const statusEl = document.getElementById("status");
      const container = document.getElementById("positions");
      try {
        const res = await fetch(`${API_BASE_URL}/portfolio/analysis`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Erreur API : ${res.status}`);
        }
        const data = await res.json();
        statusEl.style.display = "none";

        const pct = (x) => (x * 100).toFixed(1).replace(".", ",") + " %";

        data.forEach((item) => {
          const v = item.valuation;
          const currency = item.financials.currency || "";
          const iv = v.intrinsic_value_per_share;
          const mos = v.margin_of_safety_pct;

          let ivText = "N/A";
          let mosText = "N/A";
          let mosClass = "";
          if (iv != null && v.dcf_reliable) {
            ivText = `${iv} ${currency}`;
            mosText = `${mos} %`;
            mosClass = mos >= 0 ? "positive" : "negative";
          } else if (iv != null) {
            // Chiffre gardé pour info, mais sans couleur ni marge : il ne veut rien dire en l'état
            ivText = `<span class="unreliable">${iv} ${currency} (indicatif)</span>`;
            mosText = `<span class="unreliable">non pertinente</span>`;
          }

          const hypotheses = v.growth_rate_used != null
            ? `<div class="hypotheses">Hypothèses DCF : croissance ${pct(v.growth_rate_used)} décroissante, actualisation ${pct(v.discount_rate_used)}</div>`
            : "";
          const notes = v.notes.length
            ? `<details><summary>${v.notes.length} remarque${v.notes.length > 1 ? "s" : ""}</summary><ul>${v.notes.map((n) => `<li>${n}</li>`).join("")}</ul></details>`
            : "";

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="ticker">${item.financials.name || item.ticker}</div>
            <div class="row"><span>${item.ticker} · ${item.envelope ?? ""}</span><span>${item.quantity} titres</span></div>
            <div class="row"><span>Cours</span><span>${item.financials.current_price ?? "N/A"} ${currency}</span></div>
            <div class="row"><span>Score qualité</span><span>${v.quality_score != null ? v.quality_score + " / 20" : "N/A"}</span></div>
            <div class="row"><span>Valeur intrinsèque</span><span>${ivText}</span></div>
            <div class="row"><span>Marge de sécurité</span><span class="${mosClass}">${mosText}</span></div>
            ${hypotheses}
            ${notes}
          `;
          container.appendChild(card);
        });
      } catch (e) {
        statusEl.textContent = "Erreur de chargement : " + e.message;
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    loadPortfolio();
  </script>
</body>
</html>

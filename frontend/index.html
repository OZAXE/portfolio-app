<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio Insights</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-neg: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    header {
      padding: 20px 16px 8px;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
    }
    #positions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
    }
    .card .ticker {
      font-weight: 600;
      font-size: 16px;
    }
    .card .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .positive { color: var(--accent); }
    .negative { color: var(--accent-neg); }
    #status {
      padding: 16px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mon portefeuille</h1>
  </header>
  <div id="status">Chargement des analyses…</div>
  <div id="positions"></div>

  <script>
    // À adapter avec l'URL de ton backend une fois déployé sur Render
    const API_BASE_URL = "https://portfolio-app-blvx.onrender.com";

    async function loadPortfolio() {
      const statusEl = document.getElementById("status");
      const container = document.getElementById("positions");
      try {
        const res = await fetch(`${API_BASE_URL}/portfolio/analysis`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Erreur API : ${res.status}`);
        }
        const data = await res.json();
        statusEl.style.display = "none";

        data.forEach((item) => {
          const v = item.valuation;
          const mos = v.margin_of_safety_pct;
          const mosClass = mos == null ? "" : mos >= 0 ? "positive" : "negative";
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="ticker">${item.ticker} — ${item.quantity} titres</div>
            <div class="row"><span>Score qualité</span><span>${v.quality_score ?? "N/A"} / 20</span></div>
            <div class="row"><span>Valeur intrinsèque</span><span>${v.intrinsic_value_per_share ?? "N/A"}</span></div>
            <div class="row"><span>Marge de sécurité</span><span class="${mosClass}">${mos != null ? mos + " %" : "N/A"}</span></div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        statusEl.textContent = "Erreur de chargement : " + e.message;
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    loadPortfolio();
  </script>
</body>
</html>
